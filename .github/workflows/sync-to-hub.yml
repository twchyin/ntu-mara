name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git remote add huggingface \
            https://twchyin:${HF_TOKEN}@huggingface.co/spaces/twchyin/MARA_map

          SRC=$(git rev-parse --short HEAD)

          # HF's pre-receive hook rejects raw binary files (e.g. PNGs) —
          # they must be pushed as Git LFS objects. Rebuild the tree on an
          # orphan branch with *.png tracked by git-lfs: re-adding the files
          # converts them to LFS pointers, and the git-lfs pre-push hook
          # uploads the objects to the Space's LFS storage. The orphan
          # branch also keeps history stripped, as before.
          git lfs install
          git checkout --orphan hf-sync
          git rm -r --cached . -q
          git lfs track "*.png"
          git add -A
          git commit -q -m "Sync from GitHub (${SRC})"
          git push huggingface hf-sync:refs/heads/main --force --verbose
