name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git remote add huggingface \
            https://twchyin:${HF_TOKEN}@huggingface.co/spaces/twchyin/MARA_map

          # Create a single orphan commit containing only the current tree.
          # This strips all git history so HF never sees commits that had PNGs.
          TREE=$(git rev-parse HEAD^{tree})
          COMMIT=$(git commit-tree "$TREE" -m "Sync from GitHub ($(git rev-parse --short HEAD))")
          git push huggingface "${COMMIT}:refs/heads/main" --force --verbose
